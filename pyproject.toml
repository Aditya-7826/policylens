[project]
name = "policylens"
version = "0.1.0"
description = "Hybrid GraphRAG assistant for policy and compliance documents (free tier only)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "openai>=1.60",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tiktoken>=0.8",
    "sentence-transformers>=3.3",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "neo4j>=5.26",
    "spacy>=3.8",
    "langgraph>=0.2.60",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sse-starlette>=2.1",
    "streamlit>=1.40",
    "pyvis>=0.3.2",
    "httpx-sse>=0.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs Neo4j, model downloads, or API keys"]

[tool.ruff]
line-length = 100
target-version = "py312"
